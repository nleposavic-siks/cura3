<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Spin</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      body {
        background-image: url("CURA3.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      @media (max-width: 768px) {
        body {
          background-image: url("CURA3.3.jpg");
        }
      }

      .spin-btn {
        position: fixed;
        left: 50%;
        bottom: 2.5rem;
        transform: translateX(-50%);
        padding: 1.25rem 5.5rem;
        font-size: 1.75rem;
        font-weight: 800;
        background: #ffcb05;
        color: #000;
        border: none;
        border-radius: 3.75rem;
        box-shadow: 0 0 0.875rem rgba(0, 123, 255, 0.8);
        cursor: pointer;
        z-index: 10000;
        white-space: nowrap;
        transition: 0.2s ease;
      }

      .spin-btn:hover {
        transform: translateX(-50%) scale(1.05);
      }

      .spin-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .video-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.95);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .video-overlay.is-open {
        display: flex;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>

  <body>
    <button id="spinBtn" class="spin-btn">Free spin</button>

    <div id="videoOverlay" class="video-overlay">
      <video id="spinVideo" playsinline preload="auto"></video>
    </div>

    <script>
      const btn = document.getElementById("spinBtn");
      const overlay = document.getElementById("videoOverlay");
      const video = document.getElementById("spinVideo");

      const FINAL_URL = "https://bit.ly/3MtCRqZ";

      // 0 = prvi video
      // 1 = drugi video
      // 2 = gotovo (redirect)
      let step = 0;
      let playing = false;

      function play(src) {
        playing = true;
        btn.disabled = true;

        overlay.classList.add("is-open");

        video.pause();
        video.currentTime = 0;
        video.src = src;

        video.play().catch(() => {
          playing = false;
          btn.disabled = false;
        });
      }

      btn.addEventListener("click", () => {
        if (playing) return;

        if (step === 0) {
          play("1.mp4");
        } else if (step === 1) {
          play("2.mp4");
        } else if (step === 2) {
          window.location.href = FINAL_URL;
        }
      });

      video.addEventListener("ended", () => {
        overlay.classList.remove("is-open");
        playing = false;
        btn.disabled = false;

        if (step === 0) {
          step = 1;
        } else if (step === 1) {
          step = 2;
          btn.textContent = "Continue";
        }
      });
    </script>
  </body>
</html>
