<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Spin</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      /* VIDEO BASE / PREVIEW */
      .stage {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 1;
      }

      .stage video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* BUTTON */
      .spin-btn {
        position: fixed;
        left: 50%;
        bottom: 2.5rem;
        transform: translateX(-50%);
        padding: 1.25rem 5.5rem;
        font-size: 1.75rem;
        font-weight: 800;
        background: #ffcb05;
        color: #000;
        border: none;
        border-radius: 3.75rem;
        box-shadow: 0 0 0.875rem rgba(0, 123, 255, 0.8);
        cursor: pointer;
        z-index: 10;
        white-space: nowrap;
        transition: 0.2s ease;
      }

      .spin-btn:hover {
        transform: translateX(-50%) scale(1.05);
      }

      .spin-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>

  <body>
    <!-- VIDEO STAGE (preview + playback + final frame) -->
    <div class="stage">
      <video
        id="video"
        playsinline
        preload="auto"
      ></video>
    </div>

    <button id="spinBtn" class="spin-btn">Free spin</button>

    <script>
      const video = document.getElementById("video");
      const btn = document.getElementById("spinBtn");

      const FINAL_URL = "https://bit.ly/3MtCRqZ";

      // 0 = preview / prvi klik
      // 1 = drugi klik
      // 2 = gotovo (redirect)
      let step = 0;
      let playing = false;

      // inicijalni preview (prvi frame prvog videa)
      video.src = "1.mp4";
      video.pause();

      function playVideo(src, freezeOnEnd = false) {
        playing = true;
        btn.disabled = true;

        video.src = src;
        video.currentTime = 0;

        video.play().catch(() => {
          playing = false;
          btn.disabled = false;
        });

        video.onended = () => {
          playing = false;
          btn.disabled = false;

          if (freezeOnEnd) {
            // OSTAVI ZADNJI FRAME
            video.pause();
          }

          if (step === 0) {
            step = 1;
          } else if (step === 1) {
            step = 2;
            btn.textContent = "Continue";
          }
        };
      }

      btn.addEventListener("click", () => {
        if (playing) return;

        if (step === 0) {
          playVideo("1.mp4");
        } else if (step === 1) {
          playVideo("2.mp4", true); // freeze na kraju
        } else if (step === 2) {
          window.location.href = FINAL_URL;
        }
      });
    </script>
  </body>
</html>
